# TEMPORARY diagnostic workflow (investigation of the "M2.g" NoClassDefFoundError; verification of the fix).
# It is NOT part of the product and is removed again once the root cause is fixed.
#
# It builds the project exactly like android.yml (the very same `run:` steps are executed through
# .github/diag/run_step.py) and then analyses the result. Findings are returned as check-run output
# ("diag:*") and annotations so they can be read through the GitHub API.
name: Diag (temporary)

on:
  push:
    branches:
      - 'arena/482c6c59-fix-2-normal-app-now'

permissions:
  contents: read
  checks: write

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # the fixed tree + start-up probe -> runtime evidence on an emulator
          - { name: fixed-probe, probe: 'true', awt: relocated }
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ matrix.name }}
      OUT: ${{ github.workspace }}/diag-out
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v7

      - name: Checkout ProtoHax source
        uses: actions/checkout@v7
        with:
          repository: Alextheplayer919/ProtoHax
          ref: 962b96226b09f80ae471d9c6958a0b3002cb3ab1
          path: ProtoHax
          submodules: true

      - name: Checkout Bedrock 1.21.111 protocol data
        uses: actions/checkout@v7
        with:
          repository: pmmp/BedrockData
          ref: 7484fe3c3d7949fd48cc520add4f7eeebc4ba4af
          path: BedrockData

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install helper deps
        run: pip install --quiet pyyaml

      - name: Environment report
        run: |
          mkdir -p "$OUT"
          {
            echo "variant: $NAME"
            java -version 2>&1
            echo "kvm: $(ls -l /dev/kvm 2>&1)"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/cmdline-tools" 2>&1
            echo "ProtoHax HEAD: $(git -C ProtoHax rev-parse HEAD)"
            echo "submodules:"; git -C ProtoHax submodule status 2>&1 || true
            echo "mcpedata dir entries: $(ls -A ProtoHax/src/main/resources/assets/mcpedata 2>/dev/null | wc -l)"
            echo "app HEAD: $(git rev-parse HEAD)"
            echo "--- proguard-rules.pro ---"; cat app/proguard-rules.pro
            echo "--- packagingOptions ---"; sed -n '/packagingOptions/,/^    }/p' app/build.gradle
          } > "$OUT/01-env.txt" 2>&1

      # Same commands as android.yml: OAuth patch, v844/Android patches
      - name: ProtoHax patches (steps shared with android.yml)
        run: python3 .github/diag/run_step.py .github/workflows/android.yml build "Patch ProtoHax OAuth" "Build ProtoHax JAR"

      # Same commands as android.yml: build the ProtoHax shadow JAR and relocate java.awt.Color
      - name: ProtoHax build + relocation (steps shared with android.yml)
        if: matrix.awt == 'relocated'
        run: python3 .github/diag/run_step.py .github/workflows/android.yml build "Build ProtoHax JAR" "Prepare ProtoHax JAR"

      - name: ProtoHax build - control run, java.awt.Color relocation skipped on purpose
        if: matrix.awt == 'removed'
        run: python3 .github/diag/run_step.py .github/workflows/android.yml build "Build ProtoHax JAR" "Relocate java.awt.Color"

      - name: Snapshot ProtoHax JAR before stripping
        run: |
          cp ProtoHax/build/libs/ProtoHax-1.4.0.jar "$RUNNER_TEMP/prestrip.jar"
          ls -l "$RUNNER_TEMP/prestrip.jar"

      # Same commands as android.yml: strip duplicate classes, verify JAR (incl. verify_jar.py)
      - name: ProtoHax JAR prepare/verify (steps shared with android.yml)
        if: matrix.awt == 'relocated'
        run: python3 .github/diag/run_step.py .github/workflows/android.yml build "Prepare ProtoHax JAR" "Grant Gradle permission"

      - name: ProtoHax JAR prepare - control run, verification skipped on purpose
        if: matrix.awt == 'removed'
        run: python3 .github/diag/run_step.py .github/workflows/android.yml build "Prepare ProtoHax JAR" "Verify ProtoHax JAR"

      - name: Inject start-up probe
        if: matrix.probe == 'true'
        run: |
          cp .github/diag/DiagProbe.kt.txt app/src/main/java/dev/sora/protohax/DiagProbe.kt
          if [ "${{ matrix.awt }}" = "relocated" ]; then
            cp .github/diag/DiagProbeAwt.kt.txt app/src/main/java/dev/sora/protohax/DiagProbeAwt.kt
            sed -i 's#// DIAG-AWT-HOOK#DiagProbeAwt.execute()#' app/src/main/java/dev/sora/protohax/DiagProbe.kt
          fi
          python3 - <<'PY'
          p = 'app/src/main/java/dev/sora/protohax/MyApplication.kt'
          s = open(p).read()
          assert 'instance = this' in s
          s = s.replace('instance = this', 'instance = this\n        DiagProbe.start()', 1)
          open(p, 'w').write(s)
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon
          set -o pipefail
          ./gradlew app:assembleRelease --stacktrace --no-daemon 2>&1 | tee "$OUT/gradle-build.log"

      - name: Gradle tail on failure
        if: failure()
        run: |
          {
            echo "== kotlin/java compiler diagnostics =="
            grep -E '^(e|w): |error: ' "$OUT/gradle-build.log" | head -80
            echo; echo "== what went wrong =="
            sed -n '/What went wrong/,/Try:/p' "$OUT/gradle-build.log" | head -40
          } > "$OUT/05-gradle-tail.txt"

      - name: Dependency report
        if: matrix.name == 'fixed-plain'
        continue-on-error: true
        run: ./gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon --no-configuration-cache -q > "$OUT/14-deps.txt" 2>&1

      - name: Keep APK + mapping for the emulator job
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/keep/" 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/keep/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/keep"

      - name: Upload APK + mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.name }}
          path: ${{ runner.temp }}/keep/*
          if-no-files-found: warn
          overwrite: true

      - name: Analyse
        if: always()
        continue-on-error: true
        run: bash .github/diag/collect.sh

      - name: Post findings
        if: always()
        continue-on-error: true
        run: python3 .github/diag/post.py "$NAME" "$OUT/00-summary.txt" $(ls "$OUT"/[0-9][0-9]-*.txt | sort)

  emulator:
    name: emu-${{ matrix.name }}
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [fixed-probe]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK + mapping
        uses: actions/download-artifact@v8
        with:
          name: apk-${{ matrix.name }}
          path: apk

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run probe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/diag/emu.sh

      - name: Map obfuscated names back
        if: always()
        continue-on-error: true
        run: |
          OUT="$GITHUB_WORKSPACE/diag-out"; mkdir -p "$OUT"
          if [ -f apk/mapping.txt ]; then
            python3 .github/diag/analyze.py annotate apk/mapping.txt "$OUT/62-probe-raw.txt" > "$OUT/64-probe-retraced.txt"
            python3 .github/diag/analyze.py annotate apk/mapping.txt "$OUT/63-runtime-errors-raw.txt" > "$OUT/65-runtime-errors-retraced.txt"
          fi
          { echo "emulator: ${{ matrix.name }}"; grep -E "^(OK|FAIL|BEGIN|END)" "$OUT/64-probe-retraced.txt" 2>/dev/null | head -80; } > "$OUT/00-summary.txt"
          # first failure with its full cause chain (the interesting part)
          awk '/^FAIL/{c++} c>=1 && c<=3' "$OUT/64-probe-retraced.txt" >> "$OUT/00-summary.txt" 2>/dev/null || true

      - name: Post findings
        if: always()
        continue-on-error: true
        run: |
          OUT="$GITHUB_WORKSPACE/diag-out"
          python3 .github/diag/post.py "emu-${{ matrix.name }}" "$OUT/00-summary.txt" $(ls "$OUT"/[0-9][0-9]-*.txt 2>/dev/null | sort)
