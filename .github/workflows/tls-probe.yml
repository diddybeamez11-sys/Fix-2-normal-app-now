name: TLS probe (temporary)
on:
  push:
    branches: [arena/68ea4c8f-fix-2-normal-app-now]
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe xbox live hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
          openssl version
          for h in user.auth.xboxlive.com device.auth.xboxlive.com sisu.xboxlive.com xsts.auth.xboxlive.com title.auth.xboxlive.com multiplayer.minecraft.net login.live.com; do
            echo "== $h ($(getent ahosts $h | awk '{print $1}' | sort -u | tr '\n' ' '))"
            for args in "default" "-tls1_3" "-tls1_2" "-noservername" "-tls1_3 -groups X25519MLKEM768:X25519" "-tls1_3 -groups P-256" "-tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256" "-tls1_2 -cipher ECDHE-ECDSA-AES128-GCM-SHA256" "-tls1_2 -cipher ECDHE-RSA-CHACHA20-POLY1305" "-tls1_2 -cipher ECDHE-RSA-AES128-SHA" "-tls1_2 -cipher AES128-GCM-SHA256"; do
              a="$args"; sni="-servername $h"
              [ "$a" = "default" ] && a=""
              [ "$a" = "-noservername" ] && sni="" && a="-noservername"
              out=$(timeout 10 openssl s_client -connect $h:443 $sni $a </dev/null 2>&1)
              res=$(echo "$out" | grep -E "^ *(Protocol|Cipher) *:|^New, |alert|errno|Connection refused" | tr '\n' ' ' | cut -c1-200)
              echo "  [$args] $res"
            done
          done
          } > probe.txt 2>&1
          cat probe.txt
          jq -n --arg sha "$GITHUB_SHA" --rawfile text probe.txt \
            '{name:"tls-probe-result", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"TLS probe", summary:"see text", text:$text}}' \
            | gh api repos/$GITHUB_REPOSITORY/check-runs --input - > /dev/null
