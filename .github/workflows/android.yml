name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_jar:
        description: 'Commit the built ProtoHax jar to app/libs (for local builds)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # "contents: write" is used by the optional "Publish ProtoHax JAR" step
    # (workflow_dispatch with publish_jar=true, or a pushed commit whose
    # message contains [publish-jar]).
    # "checks: write" lets that step report its failure trace through a check
    # run and annotations, which stay readable even when job logs cannot be
    # downloaded.
    permissions:
      contents: write
      checks: write

    steps:
      # ---------------------------------------------------------
      # Checkout Android project
      # ---------------------------------------------------------
      - name: Checkout Android project
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Checkout ProtoHax source
      #
      # No submodules: ProtoHax keeps its block/item registry data (assets/mcpedata)
      # in a git submodule, but this repository vendors that data - and the
      # Minecraft 1.21.111 data of protocol 844 - so the build is self-contained
      # and does not depend on any other repository being reachable.
      #
      # Without registry data the shaded jar has no mappings, GameSession() throws
      # a NullPointerException -> ExceptionInInitializerError and the app's
      # MinecraftRelay object can never be initialised ("NoClassDefFoundError: M2.g").
      # ---------------------------------------------------------
      - name: Checkout ProtoHax source
        uses: actions/checkout@v7
        with:
          repository: Alextheplayer919/ProtoHax
          ref: 962b96226b09f80ae471d9c6958a0b3002cb3ab1
          path: ProtoHax

      # ---------------------------------------------------------
      # Install the vendored registry data
      #
      # .github/protohax/mcpedata     = the ProtoHax mcpedata submodule (pinned)
      # .github/protohax/bedrockdata  = pmmp/BedrockData, CC0, tag bedrock-1.21.111
      #                                 (protocol 844 = Minecraft 1.21.111)
      # ---------------------------------------------------------
      - name: Install vendored registry data
        run: |
          set -e

          assets=ProtoHax/src/main/resources/assets/mcpedata
          mkdir -p "$assets"
          cp -r .github/protohax/mcpedata/. "$assets"/

          echo "registry data files installed: $(find "$assets" -type f | wc -l)"

      # ---------------------------------------------------------
      # Java 21
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------
      # Verify Java
      # ---------------------------------------------------------
      - name: Show Java version
        run: |
          java -version
          javac -version

      # ---------------------------------------------------------
      # Fix ProtoHax Microsoft OAuth
      #
      # First login:
      #   authorization code -> grant_type=authorization_code
      #
      # Existing account:
      #   refresh token -> grant_type=refresh_token
      #
      # This removes the old token-format guessing logic.
      # ---------------------------------------------------------
      - name: Patch ProtoHax OAuth
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt"
          )

          if not p.exists():
              raise SystemExit(f"File not found: {p}")

          new_source = r'''package dev.sora.relay.session.listener.xbox

          import com.google.gson.JsonParser
          import dev.sora.relay.utils.HttpUtils
          import okhttp3.FormBody
          import okhttp3.Request


          data class XboxDeviceInfo(
              val appId: String,
              val deviceType: String,
              val allowDirectTitleTokenFetch: Boolean = false,
              val xalRedirect: String = ""
          ) {

              /**
               * Exchange the Microsoft authorization code obtained during
               * the first login for an access token and refresh token.
               */
              fun exchangeAuthorizationCode(code: String): Pair<String, String> {
                  val form = FormBody.Builder()
                      .add("client_id", appId)
                      .add(
                          "redirect_uri",
                          "https://login.live.com/oauth20_desktop.srf"
                      )
                      .add("grant_type", "authorization_code")
                      .add("code", code)
                      .build()

                  return executeTokenRequest(
                      form,
                      "exchanging authorization code"
                  )
              }

              /**
               * Refresh an existing Microsoft access token.
               */
              fun refreshAccessToken(refreshToken: String): Pair<String, String> {
                  val form = FormBody.Builder()
                      .add("client_id", appId)
                      .add(
                          "redirect_uri",
                          "https://login.live.com/oauth20_desktop.srf"
                      )
                      .add(
                          "scope",
                          "service::user.auth.xboxlive.com::MBI_SSL"
                      )
                      .add("grant_type", "refresh_token")
                      .add("refresh_token", refreshToken)
                      .build()

                  return executeTokenRequest(
                      form,
                      "refreshing access token"
                  )
              }

              private fun executeTokenRequest(
                  form: FormBody,
                  operation: String
              ): Pair<String, String> {
                  val request = Request.Builder()
                      .url("https://login.live.com/oauth20_token.srf")
                      .header(
                          "Content-Type",
                          "application/x-www-form-urlencoded"
                      )
                      .post(form)
                      .build()

                  val response = HttpUtils.client
                      .newCall(request)
                      .execute()

                  val responseBody = response.body?.string()
                      ?: throw RuntimeException(
                          "OAuth error while $operation: empty response"
                      )

                  val body = JsonParser
                      .parseString(responseBody)
                      .asJsonObject

                  if (!response.isSuccessful ||
                      !body.has("access_token") ||
                      !body.has("refresh_token")
                  ) {
                      val error =
                          body.get("error")?.asString ?: "unknown_error"

                      val description =
                          body.get("error_description")?.asString
                              ?: "no description"

                      throw RuntimeException(
                          "OAuth error while $operation: " +
                              "$error; description: $description"
                      )
                  }

                  return body.get("access_token").asString to
                      body.get("refresh_token").asString
              }

              companion object {

                  val DEVICE_ANDROID = XboxDeviceInfo(
                      "0000000048183522",
                      "Android",
                      false,
                      xalRedirect =
                          "ms-xal-0000000048183522://auth"
                  )

                  val DEVICE_IOS = XboxDeviceInfo(
                      "000000004c17c01a",
                      "iOS",
                      false,
                      xalRedirect =
                          "ms-xal-000000004c17c01a://auth"
                  )

                  val DEVICE_NINTENDO = XboxDeviceInfo(
                      "00000000441cc96b",
                      "Nintendo",
                      true
                  )

                  val devices = arrayOf(
                      DEVICE_ANDROID,
                      DEVICE_IOS,
                      DEVICE_NINTENDO
                  ).associateBy { it.deviceType }
              }
          }
          '''

          p.write_text(new_source.strip() + "\n")

          print("Patched:")
          print(p)
          PY

          echo
          echo "========================================"
          echo "OAuth source after patch"
          echo "========================================"

          grep -n \
            -E \
            'exchangeAuthorizationCode|refreshAccessToken|grant_type|refresh_token' \
            ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt

      # ---------------------------------------------------------
      # Target Minecraft Bedrock 1.21.111 (protocol 844): version, pong and
      # registry data; add the java.awt.Color stand-in used on Android
      # ---------------------------------------------------------
      - name: Patch ProtoHax for Bedrock v844 and Android
        run: python3 .github/protohax/apply_android_patches.py ProtoHax .github/protohax/bedrockdata

      # ---------------------------------------------------------
      # Build ProtoHax
      # ---------------------------------------------------------
      - name: Build ProtoHax JAR
        working-directory: ProtoHax
        run: |
          chmod +x gradlew

          ./gradlew \
            shadowJar \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Android has no java.awt: point the protocol library's
      # java.awt.Color references at the bundled stand-in
      # ---------------------------------------------------------
      - name: Relocate java.awt.Color
        run: python3 .github/protohax/relocate_awt_color.py ProtoHax/build/libs/ProtoHax-1.4.0.jar

      # ---------------------------------------------------------
      # Copy and clean ProtoHax JAR
      # ---------------------------------------------------------
      - name: Prepare ProtoHax JAR
        run: |
          set -e

          mkdir -p app/libs

          cp \
            ProtoHax/build/libs/ProtoHax-1.4.0.jar \
            app/libs/ProtoHax-1.4.0.jar

          echo "========================================"
          echo "Original ProtoHax JAR"
          echo "========================================"

          ls -lh app/libs/ProtoHax-1.4.0.jar

          echo
          echo "Removing Kotlin runtime classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'kotlin/*' >/dev/null || true

          echo
          echo "Removing JetBrains annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/jetbrains/annotations/*' >/dev/null || true

          echo
          echo "Removing IntelliJ annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/intellij/lang/annotations/*' >/dev/null || true

          echo
          echo "========================================"
          echo "Hard verification"
          echo "========================================"

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'kotlin/.*\.class'; then
            echo "ERROR: Kotlin classes still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/jetbrains/annotations/.*\.class'; then
            echo "ERROR: JetBrains annotation classes still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/intellij/lang/annotations/.*\.class'; then
            echo "ERROR: IntelliJ annotation classes still inside ProtoHax JAR."
            exit 1
          fi

          echo
          echo "SUCCESS: Duplicate classes removed."

          echo
          echo "Final JAR:"
          ls -lh app/libs/ProtoHax-1.4.0.jar

      # ---------------------------------------------------------
      # Verify important ProtoHax classes
      # ---------------------------------------------------------
      - name: Verify ProtoHax JAR
        run: |
          set -e

          echo "Checking CheatModule..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/cheat/module/CheatModule.class'

          echo "Checking XboxDeviceInfo..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/session/listener/xbox/XboxDeviceInfo.class'

          echo "Checking Bedrock protocol v844..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'org/cloudburstmc/protocol/bedrock/codec/v844/Bedrock_v844.class'

          echo
          echo "All important ProtoHax classes found."

          echo
          echo "Checking registry assets, v844 configuration and java.awt.Color relocation..."
          python3 .github/protohax/verify_jar.py app/libs/ProtoHax-1.4.0.jar

      # ---------------------------------------------------------
      # The "Publish ProtoHax JAR to app/libs" step runs at the very end
      # of this job (after "Upload APK"): a publish problem must never
      # keep the APK from being built and uploaded.
      # ---------------------------------------------------------

      # ---------------------------------------------------------
      # Make Gradle executable
      # ---------------------------------------------------------
      - name: Grant Gradle permission
        run: |
          chmod +x gradlew

      # ---------------------------------------------------------
      # Clean Android build
      # ---------------------------------------------------------
      - name: Clean Android build
        run: |
          ./gradlew \
            clean \
            --no-daemon

      # ---------------------------------------------------------
      # Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew \
            app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/release/app-release.apk

          echo
          echo "Checking that the APK carries the registry data the client needs to join..."

          for asset in \
            assets/mcpedata/blocks/index.json \
            assets/mcpedata/items/index.json \
            assets/mcpedata/item_tags.json \
            assets/mcpedata/legacy_block_states.nbt.gz \
            assets/mcpedata/blocks/canonical_block_states_844.nbt.gz \
            assets/mcpedata/items/runtime_item_states_844.json \
            assets/mcpedata/block_hardness.json; do
            unzip -l app/build/outputs/apk/release/app-release.apk "$asset" >/dev/null
            echo "  ok $asset"
          done

          echo
          echo "APK successfully built and complete:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ProtoHax-Android-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true

      # ---------------------------------------------------------
      # Upload the built ProtoHax JAR
      #
      # This is the exact file the "Publish" step below commits to
      # app/libs: uploading it means a known-good jar can always be
      # downloaded for a local build, even if a push ever fails.
      # ---------------------------------------------------------
      - name: Upload ProtoHax JAR
        uses: actions/upload-artifact@v7
        with:
          name: ProtoHax-JAR-${{ github.sha }}
          path: app/libs/ProtoHax-1.4.0.jar
          if-no-files-found: error
          overwrite: true

      # ---------------------------------------------------------
      # Publish the verified jar to app/libs
      #
      # app/libs/ProtoHax-1.4.0.jar is what a local build
      # (./gradlew app:assembleRelease) packages, so keeping the committed
      # jar current is what makes a local build produce a client that can
      # join 1.21.111 servers.
      #
      # This step runs last on purpose: when it fails, the APK above is
      # already built and uploaded.
      #
      # Triggers: workflow_dispatch with publish_jar=true, or a pushed commit
      # whose message contains [publish-jar]. The commit this step makes does
      # not contain the marker, so it cannot chain.
      #
      # Three independent mechanisms are tried in order:
      #   1. git push with the credentials actions/checkout configured,
      #   2. git push with an explicit token URL,
      #   3. a commit created through the Git data REST API.
      # If all of them fail, the whole command trace is reported through a
      # check run and error annotations, which are readable through the API
      # even when job logs cannot be downloaded.
      # ---------------------------------------------------------
      - name: Publish ProtoHax JAR to app/libs
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.publish_jar)
          || contains(github.event.head_commit.message, '[publish-jar]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          TRACE=$(mktemp)
          export TRACE

          run() {
            printf '\n$ %s\n' "$*" >> "$TRACE"
            "$@" >> "$TRACE" 2>&1
            rc=$?
            printf '[exit %s]\n' "$rc" >> "$TRACE"
            return $rc
          }

          run git remote -v
          run git log --oneline -3
          run git rev-parse --abbrev-ref HEAD
          run git status --short
          {
            echo
            echo '$ repo permissions of this job token / credential header size'
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' || true
            git config --get-all 'http.https://github.com/.extraheader' 2>/dev/null | wc -c
          } >> "$TRACE" 2>&1

          fail() {
            cat "$TRACE"
            python3 - <<'PY' || true
          import json
          import os
          import subprocess

          trace = open(os.environ["TRACE"], errors="replace").read()
          text = (trace[-60000:] or "(empty)").replace("```", "'''")
          payload = {
              "name": "publish-jar-diagnostic-%s" % os.environ.get("GITHUB_RUN_ID", ""),
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "publish-jar failed (readable copy of the trace)",
                  "summary": "publish-jar trace, tail",
                  "text": "```\n%s\n```" % text,
              },
          }
          subprocess.run(
              [
                  "gh",
                  "api",
                  "-X",
                  "POST",
                  "repos/%s/check-runs" % os.environ["GITHUB_REPOSITORY"],
                  "--input",
                  "-",
              ],
              input=json.dumps(payload).encode(),
              check=False,
          )

          lines = [line for line in trace.splitlines() if line.strip()]
          for n, chunk in enumerate(
              [" | ".join(lines[i:i + 8]) for i in range(0, len(lines), 8)][-9:], 1
          ):
              message = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print("::error title=publish-jar %d::%s" % (n, message))
          PY
            exit 1
          }

          run git config user.name "github-actions[bot]" || fail
          run git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || fail
          run git add app/libs/ProtoHax-1.4.0.jar || fail

          if git diff --cached --quiet; then
            echo "app/libs/ProtoHax-1.4.0.jar is already up to date"
            exit 0
          fi

          run git commit -m "Update the vendored ProtoHax jar (Minecraft 1.21.111 / protocol 844, registry data, java.awt.Color relocated)" || fail

          echo "--- mechanism 1: git push with the checkout credentials ---"
          if run git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "published with git push"
            exit 0
          fi

          echo "--- mechanism 2: git push with an explicit token URL ---"
          if run git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "published with an explicit token URL"
            exit 0
          fi

          echo "--- mechanism 3: commit through the Git data REST API ---"

          cat > /tmp/publish_api.py <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys

          REPO = os.environ["GITHUB_REPOSITORY"]
          BRANCH = os.environ["GITHUB_REF_NAME"]
          PATH = "app/libs/ProtoHax-1.4.0.jar"
          MESSAGE = (
              "Update the vendored ProtoHax jar (Minecraft 1.21.111 / "
              "protocol 844, registry data, java.awt.Color relocated)"
          )


          def api(method, endpoint, payload=None, jq=None):
              cmd = ["gh", "api", "-X", method, "repos/%s/%s" % (REPO, endpoint)]
              if jq is not None:
                  cmd += ["--jq", jq]
              if payload is not None:
                  cmd += ["--input", "-"]
              proc = subprocess.run(
                  cmd,
                  input=json.dumps(payload).encode() if payload is not None else None,
                  capture_output=True,
              )
              if proc.returncode != 0:
                  sys.exit(
                      "REST API %s %s failed: %s"
                      % (method, endpoint, proc.stderr.decode(errors="replace")[-2000:])
                  )
              return proc.stdout.decode(errors="replace").strip()


          head = api("GET", "git/ref/heads/%s" % BRANCH, jq=".object.sha")
          blob = api(
              "POST",
              "git/blobs",
              {
                  "content": base64.b64encode(open(PATH, "rb").read()).decode(),
                  "encoding": "base64",
              },
              jq=".sha",
          )
          tree = api("GET", "git/commits/%s" % head, jq=".tree.sha")
          new_tree = api(
              "POST",
              "git/trees",
              {
                  "base_tree": tree,
                  "tree": [
                      {"path": PATH, "mode": "100644", "type": "blob", "sha": blob}
                  ],
              },
              jq=".sha",
          )
          commit = api(
              "POST",
              "git/commits",
              {"message": MESSAGE, "tree": new_tree, "parents": [head]},
              jq=".sha",
          )
          api("PATCH", "git/refs/heads/%s" % BRANCH, {"sha": commit, "force": False})
          print("published through the REST API as %s" % commit)
          PY

          if run python3 /tmp/publish_api.py; then
            echo "published through the REST API"
            exit 0
          fi

          fail
