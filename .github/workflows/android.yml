name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout Android project
      # ---------------------------------------------------------
      - name: Checkout Android project
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Checkout ProtoHax source
      # ---------------------------------------------------------
      - name: Checkout ProtoHax source
        uses: actions/checkout@v7
        with:
          repository: Alextheplayer919/ProtoHax
          ref: 962b96226b09f80ae471d9c6958a0b3002cb3ab1
          path: ProtoHax

      # ---------------------------------------------------------
      # Java 21
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------
      # Verify Java
      # ---------------------------------------------------------
      - name: Show Java version
        run: |
          java -version
          javac -version

      # ---------------------------------------------------------
      # Fix ProtoHax Microsoft OAuth
      #
      # First login:
      #   authorization code -> grant_type=authorization_code
      #
      # Existing account:
      #   refresh token -> grant_type=refresh_token
      #
      # This removes the old token-format guessing logic.
      # ---------------------------------------------------------
      - name: Patch ProtoHax OAuth
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt"
          )

          if not p.exists():
              raise SystemExit(f"File not found: {p}")

          new_source = r'''package dev.sora.relay.session.listener.xbox

          import com.google.gson.JsonParser
          import dev.sora.relay.utils.HttpUtils
          import okhttp3.FormBody
          import okhttp3.Request


          data class XboxDeviceInfo(
              val appId: String,
              val deviceType: String,
              val allowDirectTitleTokenFetch: Boolean = false,
              val xalRedirect: String = ""
          ) {

              /**
               * Exchange the Microsoft authorization code obtained during
               * the first login for an access token and refresh token.
               */
              fun exchangeAuthorizationCode(code: String): Pair<String, String> {
                  val form = FormBody.Builder()
                      .add("client_id", appId)
                      .add(
                          "redirect_uri",
                          "https://login.live.com/oauth20_desktop.srf"
                      )
                      .add("grant_type", "authorization_code")
                      .add("code", code)
                      .build()

                  return executeTokenRequest(
                      form,
                      "exchanging authorization code"
                  )
              }

              /**
               * Refresh an existing Microsoft access token.
               */
              fun refreshAccessToken(refreshToken: String): Pair<String, String> {
                  val form = FormBody.Builder()
                      .add("client_id", appId)
                      .add(
                          "redirect_uri",
                          "https://login.live.com/oauth20_desktop.srf"
                      )
                      .add(
                          "scope",
                          "service::user.auth.xboxlive.com::MBI_SSL"
                      )
                      .add("grant_type", "refresh_token")
                      .add("refresh_token", refreshToken)
                      .build()

                  return executeTokenRequest(
                      form,
                      "refreshing access token"
                  )
              }

              private fun executeTokenRequest(
                  form: FormBody,
                  operation: String
              ): Pair<String, String> {
                  val request = Request.Builder()
                      .url("https://login.live.com/oauth20_token.srf")
                      .header(
                          "Content-Type",
                          "application/x-www-form-urlencoded"
                      )
                      .post(form)
                      .build()

                  val response = HttpUtils.client
                      .newCall(request)
                      .execute()

                  val responseBody = response.body?.string()
                      ?: throw RuntimeException(
                          "OAuth error while $operation: empty response"
                      )

                  val body = JsonParser
                      .parseString(responseBody)
                      .asJsonObject

                  if (!response.isSuccessful ||
                      !body.has("access_token") ||
                      !body.has("refresh_token")
                  ) {
                      val error =
                          body.get("error")?.asString ?: "unknown_error"

                      val description =
                          body.get("error_description")?.asString
                              ?: "no description"

                      throw RuntimeException(
                          "OAuth error while $operation: " +
                              "$error; description: $description"
                      )
                  }

                  return body.get("access_token").asString to
                      body.get("refresh_token").asString
              }

              companion object {

                  val DEVICE_ANDROID = XboxDeviceInfo(
                      "0000000048183522",
                      "Android",
                      false,
                      xalRedirect =
                          "ms-xal-0000000048183522://auth"
                  )

                  val DEVICE_IOS = XboxDeviceInfo(
                      "000000004c17c01a",
                      "iOS",
                      false,
                      xalRedirect =
                          "ms-xal-000000004c17c01a://auth"
                  )

                  val DEVICE_NINTENDO = XboxDeviceInfo(
                      "00000000441cc96b",
                      "Nintendo",
                      true
                  )

                  val devices = arrayOf(
                      DEVICE_ANDROID,
                      DEVICE_IOS,
                      DEVICE_NINTENDO
                  ).associateBy { it.deviceType }
              }
          }
          '''

          p.write_text(new_source.strip() + "\n")

          print("Patched:")
          print(p)
          PY

          echo
          echo "========================================"
          echo "OAuth source after patch"
          echo "========================================"

          grep -n \
            -E \
            'exchangeAuthorizationCode|refreshAccessToken|grant_type|refresh_token' \
            ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt

      # ---------------------------------------------------------
      # Build ProtoHax
      # ---------------------------------------------------------
      - name: Build ProtoHax JAR
        working-directory: ProtoHax
        run: |
          chmod +x gradlew

          ./gradlew \
            shadowJar \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Copy and clean ProtoHax JAR
      # ---------------------------------------------------------
      - name: Prepare ProtoHax JAR
        run: |
          set -e

          mkdir -p app/libs

          cp \
            ProtoHax/build/libs/ProtoHax-1.4.0.jar \
            app/libs/ProtoHax-1.4.0.jar

          echo "========================================"
          echo "Original ProtoHax JAR"
          echo "========================================"

          ls -lh app/libs/ProtoHax-1.4.0.jar

          echo
          echo "Removing Kotlin runtime classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'kotlin/*' >/dev/null || true

          echo
          echo "Removing JetBrains annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/jetbrains/annotations/*' >/dev/null || true

          echo
          echo "Removing IntelliJ annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/intellij/lang/annotations/*' >/dev/null || true

          echo
          echo "========================================"
          echo "Hard verification"
          echo "========================================"

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'kotlin/.*\.class'; then
            echo "ERROR: Kotlin classes still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/jetbrains/annotations/.*\.class'; then
            echo "ERROR: JetBrains annotation classes still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/intellij/lang/annotations/.*\.class'; then
            echo "ERROR: IntelliJ annotation classes still inside ProtoHax JAR."
            exit 1
          fi

          echo
          echo "SUCCESS: Duplicate classes removed."

          echo
          echo "Final JAR:"
          ls -lh app/libs/ProtoHax-1.4.0.jar

      # ---------------------------------------------------------
      # Verify important ProtoHax classes
      # ---------------------------------------------------------
      - name: Verify ProtoHax JAR
        run: |
          set -e

          echo "Checking CheatModule..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/cheat/module/CheatModule.class'

          echo "Checking XboxDeviceInfo..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/session/listener/xbox/XboxDeviceInfo.class'

          echo "Checking Bedrock protocol v844..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'org/cloudburstmc/protocol/bedrock/codec/v844/Bedrock_v844.class'

          echo
          echo "All important ProtoHax classes found."

      # ---------------------------------------------------------
      # Make Gradle executable
      # ---------------------------------------------------------
      - name: Grant Gradle permission
        run: |
          chmod +x gradlew

      # ---------------------------------------------------------
      # Clean Android build
      # ---------------------------------------------------------
      - name: Clean Android build
        run: |
          ./gradlew \
            clean \
            --no-daemon

      # ---------------------------------------------------------
      # Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew \
            app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/release/app-release.apk

          echo
          echo "APK successfully built:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ProtoHax-Android-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true
