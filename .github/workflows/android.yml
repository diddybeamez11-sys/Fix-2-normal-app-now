name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v7

      - name: Checkout ProtoHax source
        uses: actions/checkout@v7
        with:
          repository: Alextheplayer919/ProtoHax
          ref: 962b96226b09f80ae471d9c6958a0b3002cb3ab1
          path: ProtoHax

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Add OAuth diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt"
          )

          text = p.read_text()

          old = '''throw RuntimeException("error occur whilst refreshing token: " + body.get("error").asString)'''

          new = '''val description =
                                  body.get("error_description")?.asString ?: "no description"
                              throw RuntimeException(
                                  "OAuth error: " +
                                      body.get("error").asString +
                                      "; description: " +
                                      description
                              )'''

          if old in text:
              text = text.replace(old, new, 1)
          elif "OAuth error:" not in text:
              raise SystemExit("OAuth error line not found")

          p.write_text(text)
          PY

      - name: Build ProtoHax JAR
        working-directory: ProtoHax
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --stacktrace --no-daemon

      - name: Prepare ProtoHax JAR
        run: |
          mkdir -p app/libs

          cp \
            ProtoHax/build/libs/ProtoHax-1.4.0.jar \
            app/libs/ProtoHax-1.4.0.jar

          echo "Removing duplicated Kotlin runtime classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'kotlin/*' >/dev/null || true

          echo "Checking for remaining Kotlin classes..."

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'kotlin/.*\.class'; then
            echo "ERROR: Kotlin classes are still inside ProtoHax JAR."
            exit 1
          fi

          echo "ProtoHax JAR prepared successfully:"
          ls -lh app/libs/ProtoHax-1.4.0.jar

      - name: Check ProtoHax JAR
        run: |
          echo "Checking important ProtoHax classes..."

          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/cheat/module/CheatModule.class'

          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/session/listener/xbox/XboxDeviceInfo.class'

          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'org/cloudburstmc/protocol/bedrock/codec/v844/Bedrock_v844.class'

          echo "Checking that Kotlin runtime is absent..."

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'kotlin/.*\.class'; then
            echo "ERROR: Kotlin runtime still exists in JAR."
            exit 1
          fi

          echo "JAR checks passed."

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Clean Android build
        run: ./gradlew clean --no-daemon

      - name: Build release APK
        run: |
          ./gradlew \
            app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/release/app-release.apk

          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ProtoHax-Android-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true
