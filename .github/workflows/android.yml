name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout Android project
      # ---------------------------------------------------------
      - name: Checkout Android project
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Checkout the newer ProtoHax source
      # ---------------------------------------------------------
      - name: Checkout ProtoHax source
        uses: actions/checkout@v7
        with:
          repository: Alextheplayer919/ProtoHax
          ref: 962b96226b09f80ae471d9c6958a0b3002cb3ab1
          path: ProtoHax

      # ---------------------------------------------------------
      # Java 21
      # ProtoHax 1.4.0 is built for Java 21
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------
      # Verify Java
      # ---------------------------------------------------------
      - name: Show Java version
        run: |
          java -version
          javac -version

      # ---------------------------------------------------------
      # Add better Microsoft OAuth diagnostics
      # ---------------------------------------------------------
      - name: Add OAuth diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ProtoHax/src/main/java/dev/sora/relay/session/listener/xbox/XboxDeviceInfo.kt"
          )

          text = p.read_text()

          old = '''throw RuntimeException("error occur whilst refreshing token: " + body.get("error").asString)'''

          new = '''val description =
                                  body.get("error_description")?.asString ?: "no description"
                              throw RuntimeException(
                                  "OAuth error: " +
                                      body.get("error").asString +
                                      "; description: " +
                                      description
                              )'''

          if old in text:
              text = text.replace(old, new, 1)
          elif "OAuth error:" not in text:
              raise SystemExit("OAuth error line not found")

          p.write_text(text)
          PY

      # ---------------------------------------------------------
      # Build ProtoHax
      # ---------------------------------------------------------
      - name: Build ProtoHax JAR
        working-directory: ProtoHax
        run: |
          chmod +x gradlew

          ./gradlew \
            shadowJar \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Copy and clean the ProtoHax JAR
      #
      # Android already supplies:
      #   kotlin-stdlib
      #   org.jetbrains.annotations
      #   org.intellij.lang.annotations
      #
      # The shaded ProtoHax JAR must therefore not contain
      # duplicate copies of those classes.
      # ---------------------------------------------------------
      - name: Prepare ProtoHax JAR
        run: |
          set -e

          mkdir -p app/libs

          cp \
            ProtoHax/build/libs/ProtoHax-1.4.0.jar \
            app/libs/ProtoHax-1.4.0.jar

          echo "========================================"
          echo "Original ProtoHax JAR"
          echo "========================================"

          ls -lh app/libs/ProtoHax-1.4.0.jar

          echo
          echo "Removing Kotlin runtime classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'kotlin/*' >/dev/null || true

          echo
          echo "Removing JetBrains annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/jetbrains/annotations/*' >/dev/null || true

          echo
          echo "Removing IntelliJ annotation classes..."

          zip -d \
            app/libs/ProtoHax-1.4.0.jar \
            'org/intellij/lang/annotations/*' >/dev/null || true

          echo
          echo "========================================"
          echo "Checking remaining duplicate classes"
          echo "========================================"

          echo
          echo "Kotlin classes:"
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E '^[^ ]+[[:space:]]+kotlin/.*\.class$' \
            | head -20 || true

          echo
          echo "JetBrains annotation classes:"
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/jetbrains/annotations/.*\.class' \
            | head -20 || true

          echo
          echo "IntelliJ annotation classes:"
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/intellij/lang/annotations/.*\.class' \
            | head -20 || true

          echo
          echo "========================================"
          echo "Hard verification"
          echo "========================================"

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'kotlin/.*\.class'; then
            echo "ERROR: Kotlin classes are still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/jetbrains/annotations/.*\.class'; then
            echo "ERROR: JetBrains annotation classes are still inside ProtoHax JAR."
            exit 1
          fi

          if unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep -E 'org/intellij/lang/annotations/.*\.class'; then
            echo "ERROR: IntelliJ annotation classes are still inside ProtoHax JAR."
            exit 1
          fi

          echo
          echo "SUCCESS: Duplicate runtime/annotation classes removed."

          echo
          echo "Final JAR:"
          ls -lh app/libs/ProtoHax-1.4.0.jar

      # ---------------------------------------------------------
      # Verify important ProtoHax classes survived the cleanup
      # ---------------------------------------------------------
      - name: Verify ProtoHax JAR
        run: |
          set -e

          echo "Checking CheatModule..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/cheat/module/CheatModule.class'

          echo "Checking XboxDeviceInfo..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'dev/sora/relay/session/listener/xbox/XboxDeviceInfo.class'

          echo "Checking Bedrock protocol v844..."
          unzip -l app/libs/ProtoHax-1.4.0.jar \
            | grep 'org/cloudburstmc/protocol/bedrock/codec/v844/Bedrock_v844.class'

          echo
          echo "All important ProtoHax classes found."

      # ---------------------------------------------------------
      # Make Gradle executable
      # ---------------------------------------------------------
      - name: Grant Gradle permission
        run: |
          chmod +x gradlew

      # ---------------------------------------------------------
      # Clean Android build
      # ---------------------------------------------------------
      - name: Clean Android build
        run: |
          ./gradlew \
            clean \
            --no-daemon

      # ---------------------------------------------------------
      # Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew \
            app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Verify APK exists
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/release/app-release.apk

          echo
          echo "APK successfully built:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ProtoHax-Android-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true
